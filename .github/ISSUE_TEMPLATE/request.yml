name: Project Repository Request
description: Request a new project repository for your module in SCSSA-UoK.
title: "[Project Request]: "
labels: ["project-request"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎓 SCSSA-UoK Project Repository Request
        Fill out this form to request your team's project repository.
        An automated bot will validate your inputs immediately. Once approved by an organization administrator, your repository will be created with a group number assigned automatically.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Select the module this project belongs to.
      options:
        - "COSC 32133 / BECS 32263 – Full-Stack Software Development (FSSD)"
    validations:
      required: true

  - type: dropdown
    id: academic_year
    attributes:
      label: Academic Year
      description: Select the academic year for this project.
      options:
        - "24/25"
        - "25/26"
    validations:
      required: true

  - type: input
    id: short_title
    attributes:
      label: Project Short Title
      description: "A short 1–4 word title for your project (e.g. `Library System`, `Smart Bus`, `Ecommerce`). Use letters and digits separated by spaces or hyphens."
      placeholder: Library System
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Project Description
      description: One or two sentences describing what you are building.
      placeholder: A web-based library management system with real-time book tracking and a student portal.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 👥 Team Members
        Groups can have **2–4 members**. **Member 1 is the Project Lead** and will be assigned as repository Admin. Leave unused member sections blank.

  - type: markdown
    attributes:
      value: "**〔 Member 1 — Project Lead 〕**"

  - type: input
    id: member1_student_no
    attributes:
      label: "Member 1 · Student No"
      placeholder: "EC/2022/001"
    validations:
      required: true

  - type: input
    id: member1_name
    attributes:
      label: "Member 1 · Full Name"
      placeholder: "Malan De Alwis"
    validations:
      required: true

  - type: input
    id: member1_github
    attributes:
      label: "Member 1 · GitHub Username"
      placeholder: "malanalwis"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "**〔 Member 2 〕**"

  - type: input
    id: member2_student_no
    attributes:
      label: "Member 2 · Student No"
      placeholder: "EC/2022/026"
    validations:
      required: false

  - type: input
    id: member2_name
    attributes:
      label: "Member 2 · Full Name"
      placeholder: "Kavindu Sachinthe"
    validations:
      required: false

  - type: input
    id: member2_github
    attributes:
      label: "Member 2 · GitHub Username"
      placeholder: "kavindu-s"
    validations:
      required: false

  - type: markdown
    attributes:
      value: "**〔 Member 3 〕**"

  - type: input
    id: member3_student_no
    attributes:
      label: "Member 3 · Student No"
      placeholder: "EC/2022/003"
    validations:
      required: false

  - type: input
    id: member3_name
    attributes:
      label: "Member 3 · Full Name"
      placeholder: "Full Name"
    validations:
      required: false

  - type: input
    id: member3_github
    attributes:
      label: "Member 3 · GitHub Username"
      placeholder: "github-username"
    validations:
      required: false

  - type: markdown
    attributes:
      value: "**〔 Member 4 〕**"

  - type: input
    id: member4_student_no
    attributes:
      label: "Member 4 · Student No"
      placeholder: "EC/2022/019"
    validations:
      required: false

  - type: input
    id: member4_name
    attributes:
      label: "Member 4 · Full Name"
      placeholder: "Full Name"
    validations:
      required: false

  - type: input
    id: member4_github
    attributes:
      label: "Member 4 · GitHub Username"
      placeholder: "github-username"
    validations:
      required: false
